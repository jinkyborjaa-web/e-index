<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Login - Student E-Index</title>
    <link href="assets/css/styles.css" rel="stylesheet" />
    <link href="assets/css/design-system.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <main class="auth-card card">
      <div class="auth-brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5 3.5 7.5 12 11.5 20.5 7.5 12 3.5Z"></path>
          <path d="M6.5 9.2v4.3c0 1.1 2.5 2.6 5.5 2.6s5.5-1.5 5.5-2.6V9.2"></path>
          <path d="M12 11.5v8"></path>
          <path d="M8 19.5h8"></path>
        </svg>
      </div>
      <div class="card-header"><h1>Teacher Login</h1><p>Sign in to manage student records.</p></div>
      <div class="card-body">
        <div id="authMessage" class="auth-message" role="alert"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"></path><path d="m5 7 7 5 7-5"></path></svg>
              <input class="form-control" id="email" name="email" type="email" placeholder="Enter your email" required autocomplete="email" />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7.8A4 4 0 1 1 16 7.8V10"></path></svg>
              <input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" />
              <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-toggle="password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button>
            </div>
          </div>
          <button class="btn btn-primary full-width" type="submit">Log In</button>
          <p class="auth-link password-link"><a href="forgot-password.html">Forgot Password?</a></p>
        </form>
        <p class="auth-link">Need an account? <a href="signup.html">Sign up</a></p>
      </div>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/password-toggle.js"></script>
    <script type="module" src="assets/js/auth-pages.js"></script>
  </body>
</html>
