<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Student E-Index</title>
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <main class="auth-card card">
      <div class="card-header"><h1>Reset Password</h1><p>Choose a new password for your account.</p></div>
      <div class="card-body">
        <div id="authMessage" class="auth-message" role="alert"></div>
        <form id="resetForm">
          <div class="form-group"><label for="password">New Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" required autocomplete="new-password" /></div>
          <div class="form-group"><label for="confirmPassword">Confirm Password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" /></div>
          <button class="btn btn-primary full-width" type="submit">Reset Password</button>
        </form>
        <p class="auth-link"><a href="login.html">Back to Log In</a></p>
      </div>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      const form = document.getElementById('resetForm');
      const message = document.getElementById('authMessage');
      const showMessage = (text, error = true) => { message.textContent = text; message.className = `auth-message is-visible${error ? '' : ' auth-success'}`; };
      if (!token) {
        form.remove();
        showMessage('This reset link is missing a token. Please request a new one.');
        message.insertAdjacentHTML('beforeend', ' <a href="forgot-password.html">Request a new reset link</a>');
      } else {
        form.addEventListener('submit', async event => {
          event.preventDefault();
          const data = new FormData(form);
          if (data.get('password') !== data.get('confirmPassword')) return showMessage('Passwords do not match.');
          if (String(data.get('password')).length < 8) return showMessage('Password must be at least 8 characters.');
          try {
            await window.auth.request('/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: data.get('password') }) });
            showMessage('Your password has been reset successfully. Redirecting to login...', false);
            setTimeout(() => window.location.replace('login.html'), 3000);
          } catch (error) {
            showMessage(error.message);
            message.insertAdjacentHTML('beforeend', ' <a href="forgot-password.html">Request a new reset link</a>');
          }
        });
      }
    </script>
  </body>
</html>
