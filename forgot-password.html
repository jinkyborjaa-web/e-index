<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Student E-Index</title>
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body class="auth-page">
    <main class="auth-card card">
      <div class="card-header"><h1>Forgot Password?</h1><p>Enter your email to receive a reset link.</p></div>
      <div class="card-body">
        <div id="authMessage" class="auth-message" role="alert"></div>
        <form id="forgotForm">
          <div class="form-group"><label for="email">Email</label><input class="form-control" id="email" name="email" type="email" required autocomplete="email" /></div>
          <button class="btn btn-primary full-width" id="sendButton" type="submit">Send Reset Link</button>
        </form>
        <p class="auth-link"><a href="login.html">Back to Log In</a></p>
      </div>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
      document.getElementById('forgotForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.getElementById('sendButton');
        const message = document.getElementById('authMessage');
        const email = new FormData(event.currentTarget).get('email');
        button.disabled = true;
        try {
          const result = await window.auth.request('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
          message.textContent = result.message;
          message.className = 'auth-message is-visible';
        } catch (error) {
          message.textContent = error.message;
          message.className = 'auth-message is-visible';
        } finally {
          setTimeout(() => { button.disabled = false; }, 10000);
        }
      });
    </script>
  </body>
</html>
